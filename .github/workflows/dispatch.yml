name: Dispara deploy do site

on:
  push:
    branches: [main] # todo merge em main = conteúdo novo publicado

jobs:
  dispatch:
    name: Avisa o dougbrazil-blog-foundation
    runs-on: ubuntu-latest
    steps:
      - name: Repository dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SITE_DISPATCH_PAT }}
          repository: doug-brazil/dougbrazil-blog-foundation
          event-type: content-updated